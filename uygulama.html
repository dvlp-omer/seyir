<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seyir — Takım Asistanı</title>
  <meta name="description" content="Seyir — öğrenci takımları için takım asistanı: görev, son tarih, toplantı tutanağı, etkinlik, kişi rehberi ve WhatsApp mesajı.">
  <meta name="application-name" content="Seyir">
  <!-- Arama motorlarında uygulama değil tanıtım sayfası (/) çıksın -->
  <meta name="robots" content="noindex">

  <!-- Ana ekrana eklenebilir uygulama (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b2231">
  <link rel="icon" href="ikonlar/ikon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="ikonlar/ikon-maskable-512.png">

  <link rel="stylesheet" href="css/stil.css">
  <!-- Tema, sayfa çizilmeden önce uygulanmalı; bu yüzden burada (bkz. js/tema.js) -->
  <script src="js/tema.js"></script>
</head>
<body>
  <!-- Sayfa iki parçadan oluşur: yan menü (.yan) ve içerik (.govde).
       Ekranların içeriği JavaScript ile <main id="ekran"> içine çizilir. -->
  <div class="kabuk">
    <aside class="yan">
      <div class="marka">
        <!-- Logo: pusula yıldızı, küre ve yörünge şeridi (ikonlar/logo.svg ile aynı çizim).
             logo-canli: GIF'teki hareket, 6 sn döngü (css/stil.css > Canlı logo; tanıtımdaki ile aynı) -->
        <svg viewBox="0 0 64 64" aria-hidden="true" class="logo-canli">
          <defs>
            <linearGradient id="sy-a" x1="10" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#5ee6f2"/><stop offset=".5" stop-color="#5b7cfa"/><stop offset="1" stop-color="#a65cf6"/>
            </linearGradient>
            <linearGradient id="sy-y" x1="-28" y1="0" x2="28" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#5b7cfa"/><stop offset=".5" stop-color="#4fd8ec"/><stop offset="1" stop-color="#c4f3fa"/>
            </linearGradient>
            <radialGradient id="sy-c" cx="40" cy="25" r="24" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#2c4590"/><stop offset=".55" stop-color="#18205a"/><stop offset="1" stop-color="#0c0f26"/>
            </radialGradient>
          </defs>
          <path fill="url(#sy-a)" d="M32 1.5l5.6 23.2L62.5 32l-24.9 7.3L32 62.5l-5.6-23.2L1.5 32l24.9-7.3z"/>
          <g class="logo-salin"><g transform="rotate(-45 32 32) translate(32 32)">
            <path d="M28 0A28 8 0 0 1-28 0" fill="none" stroke="url(#sy-y)" stroke-width="1.4" opacity=".55"/>
          </g></g>
          <circle cx="32" cy="32" r="18.5" fill="url(#sy-c)" stroke="url(#sy-a)" stroke-width="3.4"/>
          <circle cx="32" cy="32" r="12.5" fill="none" stroke="url(#sy-a)" stroke-width="1" opacity=".6"/>
          <circle class="logo-halka-isik" cx="32" cy="32" r="18.5" pathLength="100" fill="none" stroke="#d9fbff" stroke-width="2.2" stroke-linecap="round"/>
          <g class="logo-igne">
            <path d="M41 23l-7.2 10.6-3.6-3.6z" fill="#7cf0f7"/>
            <path d="M23 41l7.2-10.6 3.6 3.6z" fill="#a65cf6"/>
            <circle cx="32" cy="32" r="1.6" fill="#e9fcff"/>
          </g>
          <g class="logo-parcaciklar" fill="#9be9f4">
            <circle cx="6" cy="40" r=".7"/><circle cx="9" cy="46" r=".5"/><circle cx="13" cy="51" r=".8"/><circle cx="4" cy="33" r=".5"/>
            <circle cx="55" cy="20" r=".6"/><circle cx="58" cy="27" r=".5"/><circle cx="51" cy="14" r=".7"/><circle cx="24" cy="59" r=".5"/>
          </g>
          <g stroke-linecap="round">
            <path d="M10.5 10.5l11 11" stroke="#5ee6f2" stroke-width="1.2"/>
            <path d="M42.5 42.5l11 11" stroke="#a65cf6" stroke-width="1.2"/>
          </g>
          <g fill="#5ee6f2" class="logo-nokta"><circle cx="10.5" cy="10.5" r="1.7"/><circle cx="17" cy="17" r="2"/><circle cx="21.5" cy="21.5" r="1.2"/></g>
          <g fill="#a65cf6" class="logo-nokta"><circle cx="53.5" cy="53.5" r="1.7"/><circle cx="47" cy="47" r="2"/><circle cx="42.5" cy="42.5" r="1.2"/></g>
          <g class="logo-salin"><g class="logo-serit" transform="rotate(-45 32 32) translate(32 32)">
            <path d="M-29 0A29 10.5 0 0 1 29 0A29 6 0 0 0-29 0z" fill="#0c0f26" opacity=".8" transform="translate(0 -1)"/>
            <path d="M-29 0A29 10 0 0 1 29 0A29 6.5 0 0 0-29 0z" fill="url(#sy-y)"/>
            <path class="logo-isik" d="M-28.5 -.6A29 9.4 0 0 1 28.5 -.6" pathLength="100" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
          </g></g>
        </svg>
        <!-- Kurumun kendi logosu varsa Seyir logosunun yerine bu görünür (js/uygulama.js > kurumuUygula) -->
        <img id="kurum-logo" class="kurum-logo" alt="" hidden>
        <div><span class="yazi-parilti" id="marka-ad">Seyir</span><small id="marka-alt">takım asistanı</small></div>
      </div>
      <nav id="menu" class="menu" aria-label="Ekranlar"></nav>
      <div class="yan-alt"><span id="depo-rozet" class="depo-rozet"></span>
        <a class="tanitim-baglanti" href="/">Seyir nedir? Tanıtım sayfası ↗</a></div>
    </aside>

    <div class="govde">
      <!-- Örnek mod şeridi: adreste ?ornek varsa görünür (js/uygulama.js > baslat).
           "?" bağlantısı adresteki ?ornek'i siler: gerçek uygulama açılır. -->
      <div id="ornek-bant" class="ornek-bant" role="status" hidden>
        <span><b>Örnek mod.</b> Uydurma bir takımla deniyorsun. Değişiklikler yalnızca bu sekmede kalır, sekmeyi kapatınca silinir.</span>
        <a href="?">Gerçek uygulamaya geç →</a>
      </div>
      <header class="ust">
        <!-- tabindex="-1": ekran değişince odak buraya taşınır (ekran okuyucu yeni ekranı okur) -->
        <h1 id="ekran-baslik" tabindex="-1">Seyir</h1>
        <!-- Genel arama (js/arayuz.js > aramaPenceresiAc); kısayolu Ctrl+K ya da / -->
        <button type="button" id="arama-dugme" class="dugme arama-dugme" aria-keyshortcuts="Control+K /" title="Her yerde ara (Ctrl+K)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <span>Ara</span><kbd class="kisayol-ipucu">Ctrl K</kbd>
        </button>
        <label>
          <span class="gizli">Etkin takım</span>
          <select id="takim-sec" class="takim-sec" hidden></select>
        </label>
      </header>
      <main id="ekran" tabindex="-1"></main>
    </div>
  </div>

  <!-- Bütün formlar bu tek pencerede açılır (bkz. js/arayuz.js > formAc) -->
  <dialog id="pencere"></dialog>
  <div id="bildirim" role="status" aria-live="polite"></div>

  <!-- Sıra önemli: önce veri ve mantık, sonra ortak arayüz, sonra ekranlar
       (menüdeki sıra da bu sıradır), en son hepsini başlatan uygulama.js.
       Buraya dosya eklersen sw.js içindeki KABUK listesine de ekle
       (testler/pwa.test.js unutursan uyarır). -->
  <script src="js/veri.js"></script>
  <script src="js/oturum.js"></script>
  <script src="js/mantik.js"></script>
  <script src="js/kurum.js"></script>
  <script src="js/yetki.js"></script>
  <script src="js/yedek.js"></script>
  <script src="js/tutanak.js"></script>
  <script src="js/docx.js"></script>
  <script src="js/kisiler.js"></script>
  <script src="js/paydas.js"></script>
  <script src="js/butce.js"></script>
  <script src="js/kolaylik.js"></script>
  <script src="js/arayuz.js"></script>
  <script src="js/paylasim.js"></script>
  <script src="js/ornek-veri.js"></script>
  <script src="js/ekranlar/ozet.js"></script>
  <script src="js/ekranlar/gorevler.js"></script>
  <script src="js/ekranlar/sontarihler.js"></script>
  <script src="js/ekranlar/takvim.js"></script>
  <script src="js/ekranlar/toplantilar.js"></script>
  <script src="js/ekranlar/tutanaklar.js"></script>
  <script src="js/ekranlar/etkinlikler.js"></script>
  <script src="js/ekranlar/duyuru.js"></script>
  <script src="js/ekranlar/kisiler.js"></script>
  <script src="js/ekranlar/paydaslar.js"></script>
  <script src="js/ekranlar/butce.js"></script>
  <script src="js/ekranlar/mesajlar.js"></script>
  <script src="js/ekranlar/takim.js"></script>
  <script src="js/ekranlar/yonetim.js"></script>
  <script src="js/ekranlar/ayarlar.js"></script>
  <script src="js/ekranlar/giris.js"></script>
  <script src="js/uygulama.js"></script>
</body>
</html>
