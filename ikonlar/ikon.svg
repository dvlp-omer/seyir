<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Seyir logosu: gemi dümeni. Lacivert zemin, açık mavi dümen, turuncu göbek.
       Renkler css/stil.css ile aynı: zemin #0b2231 (koyu lacivert), göbek #ee6a2f (turuncu vurgu).
       Not: XML yorumlarında iki tire yan yana yazılamaz. -->
  <rect width="40" height="40" rx="8" fill="#0b2231"/>
  <g stroke="#cfe3e8" stroke-linecap="round" fill="none">
    <!-- 8 kol: göbekten dümen çemberinin dışına taşar (tutamaklar) -->
    <path stroke-width="2.4" d="M20 5v30M5 20h30M9.4 9.4l21.2 21.2M30.6 9.4L9.4 30.6"/>
    <!-- dümen çemberi -->
    <circle cx="20" cy="20" r="10.5" stroke-width="2.8"/>
  </g>
  <circle cx="20" cy="20" r="4.2" fill="#ee6a2f"/>
  <circle cx="20" cy="20" r="1.5" fill="#0b2231"/>
</svg>
