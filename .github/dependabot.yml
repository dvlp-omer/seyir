# Bağımlılık güncellemeleri: GitHub her hafta denetler; güvenlik açığı ya da yeni
# sürüm varsa otomatik pull request açar. Uygulamanın kendisinin bağımlılığı yok;
# yalnızca tanıtım sayfası (tanitim-kaynak/) ve GitHub Actions adımları izlenir.
version: 2
updates:
  - package-ecosystem: npm
    directory: /tanitim-kaynak
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tanitim:
        patterns: ["*"]
    # Büyük sürüm atlamaları (React 19, Tailwind 4 gibi) kod değişikliği ister;
    # otomatik PR açılmasın. Güvenlik yamaları ve küçük güncellemeler gelir.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
