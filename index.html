<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seyir — Takım Asistanı</title>
  <meta name="description" content="Seyir — öğrenci takımları için takım asistanı: görev, son tarih, toplantı tutanağı, etkinlik, kişi rehberi ve WhatsApp mesajı.">
  <meta name="application-name" content="Seyir">

  <!-- Ana ekrana eklenebilir uygulama (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b2231">
  <link rel="icon" href="ikonlar/ikon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="ikonlar/ikon-192.png">

  <link rel="stylesheet" href="css/stil.css">
  <!-- Tema, sayfa çizilmeden önce uygulanmalı; bu yüzden burada (bkz. js/tema.js) -->
  <script src="js/tema.js"></script>
</head>
<body>
  <!-- Sayfa iki parçadan oluşur: yan menü (.yan) ve içerik (.govde).
       Ekranların içeriği JavaScript ile <main id="ekran"> içine çizilir. -->
  <div class="kabuk">
    <aside class="yan">
      <div class="marka">
        <!-- Logo: gemi dümeni (ikonlar/ikon.svg ile aynı çizim; yan menü zaten
             lacivert olduğu için burada zemin karesi yok) -->
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <g stroke="#cfe3e8" stroke-linecap="round" fill="none">
            <path stroke-width="2.4" d="M20 5v30M5 20h30M9.4 9.4l21.2 21.2M30.6 9.4L9.4 30.6"/>
            <circle cx="20" cy="20" r="10.5" stroke-width="2.8"/>
          </g>
          <circle cx="20" cy="20" r="4.2" fill="#ee6a2f"/>
          <circle cx="20" cy="20" r="1.5" fill="#0b2231"/>
        </svg>
        <div>Seyir<small>takım asistanı</small></div>
      </div>
      <nav id="menu" class="menu" aria-label="Ekranlar"></nav>
      <div class="yan-alt"><span id="depo-rozet" class="depo-rozet"></span></div>
    </aside>

    <div class="govde">
      <header class="ust">
        <!-- tabindex="-1": ekran değişince odak buraya taşınır (ekran okuyucu yeni ekranı okur) -->
        <h1 id="ekran-baslik" tabindex="-1">Seyir</h1>
        <label>
          <span class="gizli">Etkin takım</span>
          <select id="takim-sec" class="takim-sec" hidden></select>
        </label>
      </header>
      <main id="ekran" tabindex="-1"></main>
    </div>
  </div>

  <!-- Bütün formlar bu tek pencerede açılır (bkz. js/arayuz.js > formAc) -->
  <dialog id="pencere"></dialog>
  <div id="bildirim" role="status" aria-live="polite"></div>

  <!-- Sıra önemli: önce veri ve mantık, sonra ortak arayüz, sonra ekranlar
       (menüdeki sıra da bu sıradır), en son hepsini başlatan uygulama.js.
       Buraya dosya eklersen sw.js içindeki KABUK listesine de ekle
       (testler/pwa.test.js unutursan uyarır). -->
  <script src="js/veri.js"></script>
  <script src="js/oturum.js"></script>
  <script src="js/mantik.js"></script>
  <script src="js/yedek.js"></script>
  <script src="js/tutanak.js"></script>
  <script src="js/docx.js"></script>
  <script src="js/kisiler.js"></script>
  <script src="js/arayuz.js"></script>
  <script src="js/ornek-veri.js"></script>
  <script src="js/ekranlar/ozet.js"></script>
  <script src="js/ekranlar/gorevler.js"></script>
  <script src="js/ekranlar/sontarihler.js"></script>
  <script src="js/ekranlar/takvim.js"></script>
  <script src="js/ekranlar/toplantilar.js"></script>
  <script src="js/ekranlar/tutanaklar.js"></script>
  <script src="js/ekranlar/etkinlikler.js"></script>
  <script src="js/ekranlar/duyuru.js"></script>
  <script src="js/ekranlar/kisiler.js"></script>
  <script src="js/ekranlar/mesajlar.js"></script>
  <script src="js/ekranlar/takim.js"></script>
  <script src="js/ekranlar/ayarlar.js"></script>
  <script src="js/ekranlar/giris.js"></script>
  <script src="js/uygulama.js"></script>
</body>
</html>
